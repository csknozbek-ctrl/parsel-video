<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Parsel Video">
<meta name="theme-color" content="#0c1016">
<meta name="application-name" content="Parsel Video">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Parsel Video</title>
<script src="https://cdn.jsdelivr.net/npm/cesium@1.147.0/Build/Cesium/Cesium.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--zemin:#0c1016;--kutu:#161c25;--cizgi:#2a3340;--yazi:#f2f4f7;--soluk:#9aa6b5;--altin:#d9b25a;--kirmizi:#ff3b30}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--zemin);color:var(--yazi);
    font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"DejaVu Sans",Arial,sans-serif;-webkit-text-size-adjust:100%}
  #form{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(28px + env(safe-area-inset-bottom,0px))}
  h1{font-size:30px;margin:6px 0 2px;letter-spacing:-.01em}
  .alt{color:var(--altin);font-weight:700;font-size:16px;margin-bottom:18px}
  label{display:block;font-size:15px;color:var(--soluk);font-weight:600;margin:14px 0 6px}
  select,input,textarea,button{width:100%;font:inherit;font-size:19px;resize:vertical;color:var(--yazi);background:var(--kutu);border:1.5px solid var(--cizgi);
    border-radius:12px;padding:14px 14px;min-height:56px;appearance:none;-webkit-appearance:none}
  select{background-image:linear-gradient(45deg,transparent 50%,var(--soluk) 50%),linear-gradient(135deg,var(--soluk) 50%,transparent 50%);
    background-position:calc(100% - 22px) 55%,calc(100% - 15px) 55%;background-size:7px 7px;background-repeat:no-repeat;padding-right:40px}
  select:focus,input:focus,button:focus-visible{outline:3px solid var(--altin);outline-offset:1px}
  .iki{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .ana{margin-top:22px;background:var(--altin);color:#17130a;border:0;font-weight:800;font-size:21px;min-height:62px}
  .ana:disabled{opacity:.5}
  .ikincil{background:transparent}
  #durum{margin-top:16px;font-size:17px;line-height:1.45;min-height:48px;color:var(--yazi)}
  #durum.hata{color:#ff8a80}
  #cubuk{height:8px;border-radius:4px;background:var(--cizgi);overflow:hidden;margin-top:10px}
  #cubuk i{display:block;height:100%;width:0;background:var(--altin);transition:width .2s}
  details{margin-top:18px;border:1.5px solid var(--cizgi);border-radius:12px;padding:6px 14px 14px}
  summary{font-size:17px;font-weight:700;padding:10px 0;cursor:pointer}
  .ipucu{font-size:14px;color:var(--soluk);margin-top:8px;line-height:1.4}
  #sahne{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;z-index:5}
  #cikti{flex:1;min-height:0;width:100%;object-fit:contain;background:#000}
  #dugmeler{display:flex;gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));background:var(--zemin)}
  #dugmeler button{min-height:54px;font-size:17px;font-weight:700;padding:8px 6px}
  #bilgi{padding:8px 14px 0;font-size:15px;color:var(--soluk);background:var(--zemin);min-height:28px}
  #harita{position:fixed;left:0;top:0;opacity:0;pointer-events:none;z-index:-1}
  .cesium-viewer-bottom,.cesium-viewer-toolbar{display:none!important}
  #harita .cesium-viewer,#harita .cesium-viewer-cesiumWidgetContainer,#harita .cesium-widget,#harita canvas{width:100%;height:100%;display:block}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div id="form">
  <h1>Parsel Video</h1>
  <div class="alt" id="formMarka"></div>

  <label for="il">İl</label><select id="il"><option>Yükleniyor…</option></select>
  <label for="ilce">İlçe</label><select id="ilce"></select>
  <label for="mahAra">Mahalle / köy</label>
  <input id="mahAra" type="search" placeholder="Adını yazarak süzün (isteğe bağlı)" autocomplete="off">
  <select id="mah" style="margin-top:8px"></select>
  <div class="iki">
    <div><label for="ada">Ada</label><input id="ada" inputmode="numeric" autocomplete="off" placeholder="0"></div>
    <div><label for="parsel">Parsel</label><input id="parsel" inputmode="numeric" autocomplete="off"></div>
  </div>
  <label for="baslangic">Başlangıç noktası (isteğe bağlı)</label>
  <input id="baslangic" autocomplete="off" placeholder="Boş: il merkezi · yer adı ya da 39.92, 32.85">
  <label for="satilik">Satılık hisse (m²)</label>
  <input id="satilik" inputmode="numeric" autocomplete="off" placeholder="Örn. 300">
  <label for="elle">Önemli yerler (her satıra bir ad, en fazla 4)</label>
  <textarea id="elle" rows="2" autocomplete="off" placeholder="Sinpaş, Park Oran, Panora"></textarea>
  <label for="hisseKml">Satılık hisse sınırı: KML dosyası (isteğe bağlı)</label>
  <input id="hisseKml" type="file" accept=".kml,application/vnd.google-earth.kml+xml">
  <label for="hisseKoor">…ya da köşe koordinatları (her satıra “enlem, boylam”)</label>
  <textarea id="hisseKoor" rows="3" autocomplete="off" placeholder="39.9210, 32.8530"></textarea>
  <label for="yapiIsaret">Yapı işareti (isteğe bağlı): enlem, boylam</label>
  <input id="yapiIsaret" autocomplete="off" placeholder="Haritadan kopyalanan enlem, boylam">
  <div class="iki">
    <div><label for="bicim">Biçim</label><select id="bicim"><option value="dikey">Dikey (telefon)</option><option value="yatay">Yatay</option></select></div>
    <div><label for="uzunluk">Süre</label><select id="uzunluk"><option value="uzun">Uzun (~45 sn)</option><option value="kisa">Kısa (~25 sn)</option></select></div>
  </div>

  <button class="ana" id="basla">Videoyu hazırla</button>
  <div id="durum"></div>
  <div id="cubuk" hidden><i></i></div>

  <details>
    <summary>Kartvizit, ses ve kalite</summary>
    <label for="kFirma">Firma</label><input id="kFirma">
    <label for="kIsim">Ad soyad</label><input id="kIsim">
    <label for="kTel">Telefon</label><input id="kTel" inputmode="tel">
    <label for="kIlan">Sahibinden.com ilan linki</label><input id="kIlan" inputmode="url" autocomplete="off" placeholder="https://www.sahibinden.com/ilan/...">
    <label for="kYetki">Yetki belgesi numarası</label><input id="kYetki" autocomplete="off">
    <label for="sesAnahtar">Yapay ses anahtarı (Azure Speech)</label><input id="sesAnahtar" type="password" autocomplete="off">
    <label for="sesBolge">Ses bölgesi</label><input id="sesBolge" autocomplete="off" placeholder="westeurope">
    <label for="kalite">Kalite</label>
    <select id="kalite"><option value="720">HD 720 (hızlı)</option><option value="1080">Full HD 1080</option></select>
    <div class="ipucu">Video takılırsa HD 720 seçin.</div>
  </details>
  <div class="ipucu">Ana ekrana eklemek için tarayıcı menüsünden “Ana ekrana ekle”yi seçin.</div>
  <div class="ipucu" id="surum">Sürüm 5</div>
</div>

<div id="sahne" hidden>
  <canvas id="cikti"></canvas>
  <div id="bilgi"></div>
  <div id="dugmeler">
    <button id="bOynat">▶ Oynat</button>
    <button id="bKaydet" class="ana" style="margin:0">⏺ Kaydet</button>
    <button id="bPaylas" hidden>Paylaş</button>
    <button id="bIndir" hidden>İndir</button>
    <button id="bYeni" class="ikincil">Yeni</button>
  </div>
</div>
<div id="harita"></div>

<script>
"use strict";
/* ==================================================================
   PARSEL VİDEO — telefonda çalışan sürüm
   Şehir merkezinden arsaya uçar, çevreyi tek tek gösterir, parsele iner,
   kartvizitle kapanır. Her şey tek bir tuvale çizilir; o tuval kaydedilir.
   ================================================================== */
const KART = { firma: "Ankara Arazi Ofisi", isim: "Coşkun Özbek", tel: "0532 382 71 14" };
const TKGM = "https://cbsapi.tkgm.gov.tr/megsiswebapi.v3/api";
const OVERPASS = ["https://overpass-api.de/api/interpreter", "https://overpass.kumi.systems/api/interpreter", "https://overpass.private.coffee/api/interpreter"];
const NOMINATIM = "https://nominatim.openstreetmap.org/search";
const OSRM = "https://router.project-osrm.org/route/v1/driving/";
const UYDU = "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}";
const MERKEZ = { ankara: { ad: "Kızılay", lat: 39.9208, lon: 32.8541 } };   // il adı (sade) → bilinen merkez
const YAZITIPI = 'Inter,system-ui,-apple-system,"Segoe UI",Roboto,"DejaVu Sans",Arial,sans-serif';

const $ = id => document.getElementById(id);
const bekle = ms => new Promise(r => setTimeout(r, ms));
const sinirla = (x, a, b) => Math.min(b, Math.max(a, x));
const ara = (a, b, k) => a + (b - a) * k;
const yumusak = x => { x = sinirla(x, 0, 1); return x * x * (3 - 2 * x); };
const RAD = Math.PI / 180;

function trSade(s) {
  const h = { "İ": "i", "I": "i", "ı": "i", "Ş": "s", "ş": "s", "Ğ": "g", "ğ": "g", "Ü": "u", "ü": "u", "Ö": "o", "ö": "o", "Ç": "c", "ç": "c", "Â": "a", "â": "a", "Î": "i", "î": "i", "Û": "u", "û": "u" };
  return String(s || "").trim().replace(/[İIıŞşĞğÜüÖöÇçÂâÎîÛû]/g, c => h[c]).toLowerCase()
    .replace(/\s+(mahallesi|mah\.?|koyu|mh\.?)$/, "").replace(/\s+/g, " ");
}
function mesafeM(lat1, lon1, lat2, lon2) {
  const a = Math.sin((lat2 - lat1) * RAD / 2) ** 2 + Math.cos(lat1 * RAD) * Math.cos(lat2 * RAD) * Math.sin((lon2 - lon1) * RAD / 2) ** 2;
  return 2 * 6371000 * Math.asin(Math.sqrt(a));
}
function yon(lat1, lon1, lat2, lon2) {   // derece, kuzeyden saat yönünde
  const y = Math.sin((lon2 - lon1) * RAD) * Math.cos(lat2 * RAD);
  const x = Math.cos(lat1 * RAD) * Math.sin(lat2 * RAD) - Math.sin(lat1 * RAD) * Math.cos(lat2 * RAD) * Math.cos((lon2 - lon1) * RAD);
  return Math.atan2(y, x) / RAD;
}
function mesafeYazi(m) { return m < 950 ? Math.round(m / 10) * 10 + " m" : (m / 1000).toFixed(1).replace(".", ",") + " km"; }
function alanMerkezi(h) {
  let a = 0, cx = 0, cy = 0;
  for (let i = 0; i < h.length; i++) { const [x1, y1] = h[i], [x2, y2] = h[(i + 1) % h.length], c = x1 * y2 - x2 * y1; a += c; cx += (x1 + x2) * c; cy += (y1 + y2) * c; }
  if (Math.abs(a) < 1e-14) return [h.reduce((s, p) => s + p[1], 0) / h.length, h.reduce((s, p) => s + p[0], 0) / h.length];
  return [cy / (3 * a), cx / (3 * a)];
}
async function getir(url, secenek = {}, sureMs = 25000) {
  const k = new AbortController(), z = setTimeout(() => k.abort(), sureMs);
  try {
    const r = await fetch(url, { ...secenek, signal: k.signal });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return await r.json();
  } finally { clearTimeout(z); }
}

/* ---------------- TKGM ---------------- */
// TKGM, başka siteden geldiği belli olan (Referer taşıyan) istekleri "günlük limit" diye reddediyor; Referer gönderilmez.
const TKGM_AYAR = { referrerPolicy: "no-referrer" };
const tkgmBellek = new Map();
async function tkgm(yol) {
  if (!tkgmBellek.has(yol)) tkgmBellek.set(yol, getir(TKGM + yol, TKGM_AYAR).catch(e => { tkgmBellek.delete(yol); throw e; }));
  return tkgmBellek.get(yol);
}
async function tkgmListe(yol) {
  const d = await tkgm(yol);
  return d.features.map(f => f.properties).sort((a, b) => a.text.localeCompare(b.text, "tr"));
}
async function parselGetir(mahId, ada, parsel) {
  let v;
  try { v = await getir(`${TKGM}/parsel/${mahId}/${encodeURIComponent(ada)}/${encodeURIComponent(parsel)}`, TKGM_AYAR); }
  catch (e) { throw new Error(`Bu ada/parsel TKGM'de bulunamadı ya da TKGM yanıt vermedi (${e.message}).`); }
  const g = v.geometry || {};
  let h = g.type === "Polygon" ? g.coordinates[0] : g.type === "MultiPolygon" ? g.coordinates.map(p => p[0]).sort((a, b) => b.length - a.length)[0] : null;
  if (!h) throw new Error("TKGM bu parsel için sınır bilgisi döndürmedi.");
  h = h.map(p => [+p[0], +p[1]]);
  if (h[0][0] === h[h.length - 1][0] && h[0][1] === h[h.length - 1][1]) h.pop();
  const [lat, lon] = alanMerkezi(h), o = v.properties || {};
  return { lat, lon, halka: h, cap: 2 * Math.max(...h.map(p => mesafeM(lat, lon, p[1], p[0]))),
    il: o.ilAd, ilce: o.ilceAd, mahalle: o.mahalleAd, ada: o.adaNo || ada, parsel: o.parselNo || parsel,
    alan: (o.alan || "").split(",")[0], nitelik: o.nitelik || "", mevkii: o.mevkii || "" };
}

/* ---------------- Şehir merkezi ve yol ---------------- */
let nomiSira = Promise.resolve();
function nomi(param) {   // Nominatim kuralı: saniyede en çok 1 istek
  const is = nomiSira.then(async () => {
    const u = NOMINATIM + "?" + new URLSearchParams({ format: "jsonv2", "accept-language": "tr", ...param });
    try { return await getir(u, {}, 15000); } catch (e) { return []; } finally { await bekle(1100); }
  });
  nomiSira = is.catch(() => { });
  return is;
}
async function sehirMerkezi(il) {
  const b = MERKEZ[trSade(il)];
  if (b) return { ...b, etiket: `${il} · ${b.ad}` };
  const d = await nomi({ city: il, country: "Türkiye", limit: 1 });
  if (d[0]) return { ad: il, lat: +d[0].lat, lon: +d[0].lon, etiket: `${il} şehir merkezi` };
  return null;
}
async function yolGetir(a, b) {   // arabayla yol; alınamazsa null (kuş uçuşu kullanılır)
  try {
    const d = await getir(`${OSRM}${a.lon},${a.lat};${b.lon},${b.lat}?overview=simplified&geometries=geojson`, {}, 12000);
    const r = d.routes && d.routes[0];
    if (d.code !== "Ok" || !r || r.geometry.coordinates.length < 2) return null;
    return { km: r.distance / 1000, dk: Math.round(r.duration / 60), nokta: r.geometry.coordinates };
  } catch (e) { return null; }
}

/* ---------------- Çevredeki yerler ---------------- */
const KAT = {   // tür: [ad, renk, öncelik]
  hospital: ["Hastane", "#ff6b6b", 1], school: ["Okul", "#ffd24a", 2], supermarket: ["Market", "#6ee07a", 2],
  station: ["Metro / tren", "#7ab8ff", 1], university: ["Üniversite", "#ffb84a", 3], mall: ["AVM", "#54d1c2", 3],
  bus_stop: ["Otobüs durağı", "#9fd0ff", 4], pharmacy: ["Eczane", "#ff9ad5", 4], fuel: ["Akaryakıt", "#cfd6de", 6],
  place_of_worship: ["Cami", "#d7c4ff", 6], clinic: ["Sağlık merkezi", "#ff9a9a", 5]
};
const CAZ = {   // tür: [ad, renk, en çok, en küçük genişlik m]
  millet: ["Millet bahçesi", "#ffcf3f", 2, 0], proje: ["Konut / site projesi", "#ff9f43", 2, 150],
  park: ["Park", "#7be083", 1, 250], su: ["Göl / kanal", "#5cc8ff", 1, 150], gezi: ["Gezi noktası", "#d7a6ff", 1, 0]
};
const PROJE_ADI = /(konut|evler|site|residen|rezidans|villa|konak|vadi|park|kent|tower|kule|city|life|garden|bahçe|panorama|teras|country|royal|prestij|elit)/i;
function cazibeTuru(e, ad) {
  if (/millet bah[çc]esi/i.test(ad)) return "millet";
  if (e.landuse === "residential") return /(mahallesi|köyü|mah\.)\s*$/i.test(ad) ? null : "proje";
  if (["park", "nature_reserve", "golf_course", "garden"].includes(e.leisure)) return "park";
  if (e.natural === "water" || ["canal", "river"].includes(e.waterway)) return "su";
  if (["attraction", "theme_park", "zoo", "museum", "viewpoint"].includes(e.tourism)) return "gezi";
  return null;
}
let overpassKapali = false;
async function overpass(sorgu, sureMs = 14000) {   // sunucular aynı anda denenir, ilk yanıt veren kazanır
  if (overpassKapali) return null;
  try {
    return await Promise.any(OVERPASS.map(s => getir(s, { method: "POST", body: new URLSearchParams({ data: sorgu }) }, sureMs).then(d => d.elements || [])));
  } catch (e) { overpassKapali = true; return null; }   // hiçbiri yanıt vermedi: bu video için yedek yönteme geç
}
const kutu = (lat, lon, r) => { const dy = r / 111320, dx = r / (111320 * Math.cos(lat * RAD)); return `${lon - dx},${lat + dy},${lon + dx},${lat - dy}`; };
const elKonum = el => [el.lat ?? (el.center || {}).lat, el.lon ?? (el.center || {}).lon];

async function cevreYerler(lat, lon, enCok, ilerle) {
  let secilen = [];
  for (const r of [1500, 4000, 10000]) {
    ilerle(`Çevre aranıyor (${r / 1000} km)…`);
    const a = `(around:${r},${lat},${lon})`;
    let ham = await overpass(`[out:json][timeout:12];(nwr${a}["amenity"~"^(hospital|clinic|pharmacy|school|university|fuel)$"];
      nwr${a}["amenity"="place_of_worship"]["religion"="muslim"];nwr${a}["shop"~"^(supermarket|mall)$"];
      node${a}["highway"="bus_stop"];nwr${a}["railway"="station"];);out center tags;`);
    if (ham) {
      ham = ham.map(el => { const t = el.tags || {}, [la, lo] = elKonum(el);
        return { ad: t.name, tur: t.amenity || t.shop || t.highway || (t.railway ? "station" : null), lat: la, lon: lo }; });
    } else {   // yedek: Nominatim (yavaş olduğu için en küçük halka atlanır)
      if (r < 4000) continue;
      ham = [];
      for (const [kelime, tur] of [["hospital", "hospital"], ["school", "school"], ["supermarket", "supermarket"], ["pharmacy", "pharmacy"], ["bus stop", "bus_stop"], ["fuel", "fuel"]]) {
        for (const d of await nomi({ q: kelime, viewbox: kutu(lat, lon, r), bounded: 1, limit: 40 }))
          if (d.type === tur) ham.push({ ad: d.name, tur, lat: +d.lat, lon: +d.lon });
      }
    }
    const yakin = {};
    ham.filter(y => y.lat && KAT[y.tur]).map(y => ({ ...y, m: mesafeM(lat, lon, y.lat, y.lon) })).filter(y => y.m <= r)
      .sort((x, y) => x.m - y.m).forEach(y => { if (!yakin[y.tur]) yakin[y.tur] = y; });
    secilen = Object.values(yakin);
    if (secilen.length >= 4) break;
  }
  return secilen.sort((x, y) => KAT[x.tur][2] - KAT[y.tur][2] || x.m - y.m).slice(0, enCok).sort((x, y) => x.m - y.m)
    .map(y => ({ ...y, kategori: KAT[y.tur][0], renk: KAT[y.tur][1], ad: y.ad || KAT[y.tur][0], grup: "cevre" }));
}
async function cazibeMerkezleri(lat, lon, r, enCok, ilerle) {
  ilerle("Cazibe merkezleri aranıyor…");
  const a = `(around:${r},${lat},${lon})`;
  let ham = await overpass(`[out:json][timeout:20];(nwr${a}["leisure"~"^(park|nature_reserve|golf_course)$"]["name"];
    nwr${a}["natural"="water"]["name"];way${a}["waterway"~"^(canal|river)$"]["name"];nwr${a}["landuse"="residential"]["name"];
    nwr${a}["tourism"~"^(attraction|theme_park|zoo|museum)$"]["name"];);out tags center bb;`, 22000);
  if (ham) {
    ham = ham.map(el => { const t = el.tags || {}, [la, lo] = elKonum(el), b = el.bounds;
      return { ad: t.name || "", tur: cazibeTuru(t, t.name || ""), lat: la, lon: lo,
        en: b ? Math.max((b.maxlat - b.minlat) * 111320, (b.maxlon - b.minlon) * 111320 * Math.cos(lat * RAD)) : null }; });
  } else {
    ham = [];
    for (const kelime of ["millet bahçesi", "park", "gölü", "kanal", "sitesi", "konutları", "evleri"]) {
      for (const d of await nomi({ q: kelime, viewbox: kutu(lat, lon, r), bounded: 1, limit: 40 })) {
        if (!d.name) continue;
        const k = d.boundingbox.map(Number);
        ham.push({ ad: d.name, tur: cazibeTuru({ [d.category]: d.type }, d.name), lat: +d.lat, lon: +d.lon,
          en: Math.max((k[1] - k[0]) * 111320, (k[3] - k[2]) * 111320 * Math.cos(lat * RAD)) });
      }
    }
  }
  const gorulen = new Set(), aday = [];
  for (const y of ham) {
    if (!y.tur || !y.lat) continue;
    y.m = mesafeM(lat, lon, y.lat, y.lon);
    const anahtar = y.tur + "|" + trSade(y.ad.replace(/\s*\d+\.?\s*(etap|kısım|blok).*$/i, ""));

function kamera(t) {

/* ---------------- Tuval üstü yazılar (HUD) ---------------- */

  yaz(3.4 * u, 600); ctx.fillStyle = "#d5dbe3"; ctx.fillText(sigdir(`${p.ilce} / ${p.il}` + (p.mevkii ? ` · ${p.mevkii} mevkii` : ""), basW - 5.5 * u), basX + 3.2 * u, basY + 8.2 * u);

function koordCoz(metin) {   // "enlem, boylam" → [boylam, enlem]
  const k = String(metin || "").trim().match(/^(-?\d{1,2}[.,]\d+)\s*[, ]\s*(\d{1,3}[.,]\d+)$/);

  if (yapiMetin && !yapi) { durum("Yapı işareti “enlem, boylam” biçiminde olmalı.", null, true); return; }
  const a = { il: sec("il").textContent, ilce: sec("ilce").textContent, mahalle: sec("mah").textContent, mahId: $("mah").value,
    ada: $("ada").value.trim() || "0", parsel: $("parsel").value.trim(), bicim: $("bicim").value, uzunluk: $("uzunluk").value, kalite: +$("kalite").value, satilik: $("satilik").value.trim(), baslangic: $("baslangic").value.trim(), elle: $("elle").value, hisse, yapi, kart: kartOku() };
  for (const [k, v] of [["il", a.il], ["ilce", a.ilce], ["mah", a.mahalle], ["bicim", a.bicim], ["uzunluk", a.uzunluk], ["kalite", a.kalite], ["firma", a.kart.firma], ["isim", a.kart.isim], ["tel", a.kart.tel], ["ilan", a.kart.ilan], ["yetki", a.kart.yetki], ["sesAnahtar", sesAnahtar], ["sesBolge", sesBolge]]) sakla.yaz(k, v);
  $("basla").disabled = true; sonVideo = null; $("bIndir").hidden = true; $("bPaylas").hidden = true;
  try {
    await Promise.all(["800", "700", "600"].map(w => document.fonts.load(`${w} 40px Inter`))).catch(() => { });
    await hazirla(a, durum);
    await sesHazirla(sesAnahtar, sesBolge, durum);
    await onYukle(durum);
    $("form").hidden = true; $("sahne").hidden = false;
    $("bilgi").textContent = `${Math.round(S.sure)} saniyelik video hazır. “Kaydet” videoyu dosyaya çevirir.` + (S.atlanan && S.atlanan.length ? ` Bulunamayan yerler: ${S.atlanan.join(", ")}.` : "");
    try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(() => { }); } catch (e) { }
    durum("");
  } catch (e) { durum(e.message || String(e), null, true); }
  $("basla").disabled = false;
}
